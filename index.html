  <head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
      <!--
        The entry script below is referenced relatively ("./index.<hash>.js") and
        this file ships no base element, because the mount is per-client and unknown
        at build time: one dist/ serves /cars/, /mig_26/ and any other tenant, and
        baking the name in would break the rest.

        A relative URL resolves against the document, which is correct at depth 1
        only. On a deep link such as /cars/sell-bills/5 the browser would request
        /cars/sell-bills/index.<hash>.js, miss, and be served this file with
        Content-Type: text/html -- "Failed to load module script ... text/html" on
        every route with a path parameter, presenting as a blank tab while the
        page still returned 200.

        So nginx injects the base when serving this shell, via sub_filter on the
        charset meta tag below (deploy/render-nginx-multitenant.php). That keeps one
        build portable to any tenant. A subdomain mount gets no injection at all:
        the app is already at the root of its host, so a base there would be wrong.

        CONSEQUENCE: the charset meta tag directly above is the anchor for that
        injection, and this file is what the rule matches. Removing or reformatting
        it breaks every deep link. If you see the MIME error, check that the served
        HTML still contains a base element. See DEPLOYMENT.md 6.1.

        Do NOT reintroduce a base computed from window.location.pathname: /cars/ is
        the mount, but /cars is also a route, so a pathname heuristic mis-detects
        it and resolves to '/'. The mount point for JS consumers comes from
        src/utils/basePath.js, which reads import.meta.url.
      -->
    <link rel="icon" href="./logo_default.png" type="image/png" id="favicon-link">
    <link rel="apple-touch-icon" href="./logo_default.png" id="apple-touch-link">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars Management System</title>
    <script>
      // Update favicon based on logged-in user
      (function() {
        function updateFavicon(iconUrl) {
          const faviconLink = document.getElementById('favicon-link')
          const appleTouchLink = document.getElementById('apple-touch-link')
          if (faviconLink) faviconLink.href = iconUrl
          if (appleTouchLink) appleTouchLink.href = iconUrl
        }

        function getBasePath() {
          // Relative to the document URL, so this resolves to the app directory
          // in every deployment (see the note about <base> above).
          return './'
        }

        function getApiBase() {
          // The API ships inside the app folder, so it is <origin><base>api —
          // e.g. https://host/cars/api for an app in /cars/. This is the same
          // rule as resolveApiBaseUrl() in src/utils/basePath.js, which the app
          // itself uses; keep the two in step. Do NOT treat a LAN IP as a dev
          // box here: a server deployed on 192.168.x.x has its API next to it,
          // not on :8000. Only the Vite dev server (which serves from /) differs,
          // and it has no trailing base, so getBasePath() + 'api' resolves
          // correctly for it too.
          return new URL(getBasePath() + 'api', window.location.href).href;
        }

        function getFileUrl(path, baseDirectory) {
          if (!path || typeof path !== 'string' || path.trim() === '') {
            return ''
          }
          if (path.startsWith('http://') || path.startsWith('https://')) {
            return path
          }
          const apiBase = getApiBase()
          const uploadUrl = apiBase + '/upload.php'
          const url = new URL(uploadUrl)
          url.searchParams.set('path', path.replace(/^\/+/, ''))
          if (baseDirectory) {
            url.searchParams.set('base_directory', baseDirectory)
          }
          return url.toString()
        }

        // The token this build stores for api.php, or '' when nobody is signed in.
        //
        // api.php's query passthrough is behind the session gate, so every caller
        // below has to carry it - and has to accept that it cannot answer at all
        // before login. They all return null in that case, which is what the caller
        // already does with a null: fall back to the shared default branding.
        function apiToken() {
          try {
            const user = JSON.parse(localStorage.getItem('user') || 'null')
            return user && typeof user.token === 'string' ? user.token : ''
          } catch (e) {
            return ''
          }
        }

        // One row out of `banks`, or null. No `dbname`: the server resolves the
        // database from the URL this page was served on, so the client has nothing
        // to name and sending a name would be claiming authority it does not have.
        //
        // This used to fetch <mount>db_code.json and hand that code to
        // db_manager_api.php to learn which database and which uploads folder to
        // use. Neither exists: the folder is the database, and the uploads folder is
        // always `files/`. The two round trips are gone rather than re-pointed.
        async function fetchBankRow(sql, params) {
          const token = apiToken()
          if (!token) return null
          try {
            const res = await fetch(getApiBase() + '/api.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: sql, params: params, token: token })
            })
            const result = await res.json()
            if (result.success && result.data && result.data[0]) return result.data[0]
          } catch (e) {}
          return null
        }

        async function fetchDifferentCompanyUserLogo(user) {
          if (!user || !user.path_logo || typeof user.path_logo !== 'string' || user.path_logo.trim() === '') return null
          return getFileUrl(user.path_logo, 'files')
        }

        async function fetchUserBankCompanyName(user) {
          if (!user || !user.id_bank_account) return null
          const bank = await fetchBankRow('SELECT company_name FROM banks WHERE id = ?', [user.id_bank_account])
          return bank && bank.company_name ? bank.company_name : null
        }

        async function fetchActiveBankLogo() {
          const bank = await fetchBankRow('SELECT logo_path FROM banks WHERE is_active = 1 LIMIT 1', [])
          if (!bank || !bank.logo_path) return null
          return getFileUrl(bank.logo_path, 'files')
        }

        async function loadFavicon() {
          const basePath = getBasePath()
          const defaultTitle = 'Cars Management System'
          const userStr = localStorage.getItem('user')

          if (userStr) {
            try {
              const user = JSON.parse(userStr)
              const isDifferentCompany = user && (
                user.is_diffrent_company === 1 ||
                user.is_diffrent_company === true ||
                user.is_diffrent_company === '1'
              )

              if (isDifferentCompany) {
                var companyName = await fetchUserBankCompanyName(user)
                document.title = companyName ? (companyName + ' - Cars Management System') : defaultTitle
                var userLogoUrl = await fetchDifferentCompanyUserLogo(user)
                if (userLogoUrl) {
                  updateFavicon(userLogoUrl)
                  return
                }
                updateFavicon(basePath + 'logo_default.png')
                return
              }
            } catch (e) {}
          }

          document.title = defaultTitle
          var activeBankLogoUrl = await fetchActiveBankLogo()
          if (activeBankLogoUrl) {
            updateFavicon(activeBankLogoUrl)
            return
          }

          updateFavicon(basePath + 'logo.png')
        }

        // Update favicon on page load
        loadFavicon()

        // Listen for user login/logout events
        window.addEventListener('storage', (e) => {
          if (e.key === 'user') {
            loadFavicon()
          }
        })
        window.addEventListener('userLogin', loadFavicon)
        window.addEventListener('userLogout', loadFavicon)
        window.addEventListener('companyInfoUpdated', function() {
          window.location.reload()
        })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Add error handler for module loading failures
      window.addEventListener('error', (event) => {
        if (event.target && event.target.tagName === 'SCRIPT') {
          // Script loading error - handled silently
        }
      }, true)
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
